{{- /*
Argo CD cluster Secret per environment. Pick the auth method with environments[].cluster.provider:

  aws    EKS via IAM role (awsAuthConfig)
  gcp    GKE via Workload Identity / GCP credentials (argocd-k8s-auth gcp)
  azure  AKS via Entra ID: workloadidentity | spn | msi (argocd-k8s-auth azure)
  token  Any cluster, service-account bearer token
  tls    Any cluster, client certificate + key
  exec   Any cluster, custom client-go exec plugin

Skipped for in-cluster (server https://kubernetes.default.svc), provider "in-cluster", or cluster.create=false.
Legacy: with no cluster block, env.accountID + env.roleARN + env.caData still means aws.
*/ -}}
{{- range $env := .Values.environments }}
{{- $c := $env.cluster | default dict }}
{{- $provider := $c.provider | default "" }}
{{- if and (not $provider) $env.accountID $env.roleARN $env.caData }}
{{- $provider = "aws" }}
{{- end }}
{{- $inCluster := or (eq $provider "in-cluster") (eq ($env.server | default "") "https://kubernetes.default.svc") }}
{{- if and $provider (not $inCluster) (dig "create" true $c) }}
{{- $clusterName := $c.name | default $env.clusterName }}

{{- /* TLS settings shared by every provider */ -}}
{{- $tls := dict "insecure" (dig "tls" "insecure" false $c) }}
{{- with (dig "tls" "caData" ($env.caData | default "") $c) }}{{- $_ := set $tls "caData" . }}{{- end }}
{{- with (dig "tls" "serverName" "" $c) }}{{- $_ := set $tls "serverName" . }}{{- end }}
{{- with (dig "tls" "certData" "" $c) }}{{- $_ := set $tls "certData" . }}{{- end }}
{{- with (dig "tls" "keyData" "" $c) }}{{- $_ := set $tls "keyData" . }}{{- end }}
{{- $cfg := dict "tlsClientConfig" $tls }}

{{- if eq $provider "aws" }}
  {{- $roleARN := dig "aws" "roleARN" "" $c }}
  {{- if and (not $roleARN) $env.roleARN }}
  {{- $roleARN = printf "arn:aws:iam::%s:role/%s" (required (printf "environments[%s].accountID is required to build roleARN" $env.name) $env.accountID) $env.roleARN }}
  {{- end }}
  {{- $aws := dict "clusterName" (dig "aws" "clusterName" $env.clusterName $c) }}
  {{- with $roleARN }}{{- $_ := set $aws "roleARN" . }}{{- end }}
  {{- with (dig "aws" "profile" "" $c) }}{{- $_ := set $aws "profile" . }}{{- end }}
  {{- $_ := set $cfg "awsAuthConfig" $aws }}

{{- else if eq $provider "gcp" }}
  {{- $_ := set $cfg "execProviderConfig" (dict
        "command" "argocd-k8s-auth"
        "args" (list "gcp")
        "apiVersion" "client.authentication.k8s.io/v1beta1") }}

{{- else if eq $provider "azure" }}
  {{- $method := dig "azure" "loginMethod" "workloadidentity" $c }}
  {{- $envVars := dict
        "AAD_LOGIN_METHOD" $method
        "AAD_ENVIRONMENT_NAME" (dig "azure" "environment" "AzurePublicCloud" $c) }}
  {{- if eq $method "workloadidentity" }}
    {{- $_ := set $envVars "AZURE_CLIENT_ID" (required (printf "environments[%s].cluster.azure.clientID is required" $env.name) (dig "azure" "clientID" "" $c)) }}
    {{- $_ := set $envVars "AZURE_TENANT_ID" (required (printf "environments[%s].cluster.azure.tenantID is required" $env.name) (dig "azure" "tenantID" "" $c)) }}
    {{- $_ := set $envVars "AZURE_FEDERATED_TOKEN_FILE" (dig "azure" "federatedTokenFile" "/var/run/secrets/azure/tokens/azure-identity-token" $c) }}
    {{- $_ := set $envVars "AZURE_AUTHORITY_HOST" (dig "azure" "authorityHost" "https://login.microsoftonline.com/" $c) }}
  {{- else if eq $method "spn" }}
    {{- $_ := set $envVars "AAD_SERVICE_PRINCIPAL_CLIENT_ID" (required (printf "environments[%s].cluster.azure.clientID is required" $env.name) (dig "azure" "clientID" "" $c)) }}
    {{- $_ := set $envVars "AAD_SERVICE_PRINCIPAL_CLIENT_SECRET" (required (printf "environments[%s].cluster.azure.clientSecret is required" $env.name) (dig "azure" "clientSecret" "" $c)) }}
    {{- $_ := set $envVars "AZURE_TENANT_ID" (required (printf "environments[%s].cluster.azure.tenantID is required" $env.name) (dig "azure" "tenantID" "" $c)) }}
  {{- else if eq $method "msi" }}
    {{- with (dig "azure" "clientID" "" $c) }}{{- $_ := set $envVars "AZURE_CLIENT_ID" . }}{{- end }}
  {{- else }}
    {{- fail (printf "environments[%s].cluster.azure.loginMethod must be workloadidentity, spn or msi" $env.name) }}
  {{- end }}
  {{- $_ := set $cfg "execProviderConfig" (dict
        "command" "argocd-k8s-auth"
        "args" (list "azure")
        "env" $envVars
        "apiVersion" "client.authentication.k8s.io/v1beta1") }}

{{- else if eq $provider "token" }}
  {{- $_ := set $cfg "bearerToken" (required (printf "environments[%s].cluster.bearerToken is required" $env.name) $c.bearerToken) }}

{{- else if eq $provider "tls" }}
  {{- if not (and $tls.certData $tls.keyData) }}
  {{- fail (printf "environments[%s].cluster.tls.certData and keyData are required for provider tls" $env.name) }}
  {{- end }}

{{- else if eq $provider "exec" }}
  {{- $exec := required (printf "environments[%s].cluster.exec is required for provider exec" $env.name) $c.exec }}
  {{- $_ := required (printf "environments[%s].cluster.exec.command is required" $env.name) $exec.command }}
  {{- $_ := set $cfg "execProviderConfig" (merge (deepCopy $exec) (dict "apiVersion" "client.authentication.k8s.io/v1beta1")) }}

{{- else }}
  {{- fail (printf "environments[%s].cluster.provider %q is not supported (aws, gcp, azure, token, tls, exec, in-cluster)" $env.name $provider) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $clusterName }}-secret
  namespace: {{ $.Values.argocd.namespace }}
  labels:
    argocd.argoproj.io/secret-type: cluster
    {{- with $c.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $c.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  name: {{ $clusterName | quote }}
  server: {{ required (printf "environments[%s].server is required" $env.name) $env.server | quote }}
  {{- with $c.project }}
  project: {{ . | quote }}
  {{- end }}
  {{- with $c.namespaces }}
  namespaces: {{ join "," . | quote }}
  {{- end }}
  {{- if hasKey $c "clusterResources" }}
  clusterResources: {{ $c.clusterResources | toString | quote }}
  {{- end }}
  config: |
    {{- $cfg | toPrettyJson | nindent 4 }}
{{- end }}
{{- end }}
