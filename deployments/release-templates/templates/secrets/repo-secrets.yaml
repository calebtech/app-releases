{{- if .Values.secrets.create }}
{{- range $app := $.Values.applications }}
{{- range $i, $repo := (include "release-templates.gitRepos" $ | fromJsonArray) }}
---
# Argo CD: read access to the release (values) repo, scoped to the app's project
apiVersion: v1
kind: Secret
metadata:
  name: {{ $app.name }}-git-{{ $i }}
  namespace: {{ $.Values.argocd.namespace }}
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: {{ $repo }}
  username: {{ $.Values.secrets.gitUsername | required "secrets.gitUsername is required (or set secrets.create=false)" }}
  password: {{ $.Values.secrets.gitPassword | required "secrets.gitPassword is required (or set secrets.create=false)" }}
  project: {{ $app.name }}
---
# Kargo: write access to the release repo (clone/commit/push/PR)
apiVersion: v1
kind: Secret
metadata:
  name: {{ $app.name }}-git-{{ $i }}
  namespace: {{ $app.name }}
  labels:
    kargo.akuity.io/cred-type: git
stringData:
  repoURL: {{ $repo }}
  username: {{ $.Values.secrets.gitUsername }}
  password: {{ $.Values.secrets.gitPassword }}
{{- end }}
{{- end }}
{{- end }}
