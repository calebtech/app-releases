{{- range $app := $.Values.applications }}
{{- range $env := $.Values.environments }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
{{- $name := printf "%s-%s" $app.name $env.fullname }}
{{- $ns := include "release-templates.appNamespace" (dict "app" $app "root" $) }}
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  annotations:
    kargo.akuity.io/authorized-stage: {{ $app.name }}:{{ $env.fullname }}
spec:
  project: {{ $app.name }}
  sources:
    - repoURL: {{ include "release-templates.chartRepo" (dict "app" $app "env" $env) }}
      chart: {{ $app.chartName }}
      targetRevision: {{ include "release-templates.targetRevision" (dict "app" $app "name" $name "namespace" $ns) | quote }}
      helm:
        releaseName: {{ $app.name }}
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/{{ include "release-templates.envPath" $env }}/{{ $app.name }}/values.yaml
    - repoURL: {{ $env.gitRepo }}
      targetRevision: {{ $env.branch | default "main" }}
      ref: values
  destination:
    server: {{ $env.server }}
    namespace: {{ include "release-templates.destNamespace" (dict "app" $app "env" $env) }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
{{- end }}
{{- end }}
