{{- range $app := $.Values.applications }}
{{- range $env := $.Values.environments }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $app.name }}-{{ $env.fullname }}
  namespace: {{ include "release-templates.appNamespace" (dict "app" $app "root" $) }}
  annotations:
    kargo.akuity.io/authorized-stage: {{ $app.name }}:{{ $env.fullname }}
spec:
  project: {{ $app.name }}
  # Wrapper chart in the release repo: <env path>/<app>/{Chart.yaml,values.yaml}.
  # The dependency version in Chart.yaml is what Kargo promotes, so the spec here never changes.
  source:
    repoURL: {{ $env.gitRepo }}
    targetRevision: {{ $env.branch | default "main" }}
    path: {{ include "release-templates.envPath" $env }}/{{ $app.name }}
    helm:
      releaseName: {{ $app.name }}
      valueFiles:
        - values.yaml
  destination:
    server: {{ $env.server }}
    namespace: {{ include "release-templates.destNamespace" (dict "app" $app "env" $env) }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
{{- end }}
{{- end }}
