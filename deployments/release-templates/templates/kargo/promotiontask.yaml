{{- range $app := $.Values.applications }}
{{- $openPR := $.Values.kargo.openPR }}
{{- if hasKey $app "openPR" }}{{- $openPR = $app.openPR }}{{- end }}
---
# Promotion = a git commit that bumps the chart dependency version in the env's wrapper chart
# (<env path>/<app>/Chart.yaml). Argo CD deploys that folder from git, so git is the source of truth.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: {{ $app.name }}
  namespace: {{ $app.namespace }}
spec:
  vars:
  - name: chartName
    value: {{ $app.chartName }}
  - name: gitRepo # populated from stage
  - name: branch # populated from stage
  - name: appPath # populated from stage: <env path>/<app>
  - name: chartRepo # populated from stage
  - name: argocdApp # populated from stage
  - name: argocdAppNamespace # populated from stage
  steps:
  - uses: git-clone
    config:
      repoURL: ${{`{{ vars.gitRepo }}`}}
      checkout:
      - branch: ${{`{{ vars.branch }}`}}
        path: ./src
  - uses: helm-update-chart
    as: update-chart
    config:
      path: ./src/${{`{{ vars.appPath }}`}}
      charts:
      - repository: oci://${{`{{ vars.chartRepo }}`}}
        name: ${{`{{ vars.chartName }}`}}
        version: ${{`{{ chartFrom("oci://" + vars.chartRepo + "/" + vars.chartName).Version }}`}}
  - uses: git-commit
    as: commit
    config:
      path: ./src
      message: ${{`{{ task.outputs['update-chart'].commitMessage }}`}}
  {{- if $openPR }}
  - uses: git-push
    as: push
    config:
      path: ./src
      generateTargetBranch: true
  - uses: git-open-pr
    as: open-pr
    config:
      repoURL: ${{`{{ vars.gitRepo }}`}}
      sourceBranch: ${{`{{ task.outputs.push.branch }}`}}
      targetBranch: ${{`{{ vars.branch }}`}}
      title: ${{`{{ vars.argocdApp }}`}} - ${{`{{ task.outputs['update-chart'].commitMessage }}`}}
  - uses: git-wait-for-pr
    as: wait-for-pr
    config:
      repoURL: ${{`{{ vars.gitRepo }}`}}
      prNumber: ${{`{{ task.outputs['open-pr'].prNumber }}`}}
  {{- else }}
  # Direct push to the branch (no PR) - handy for local testing.
  - uses: git-push
    as: push
    config:
      path: ./src
  {{- end }}
  # Sync the app and wait until Argo CD has deployed the promoted commit.
  # targetRevision stays on the branch; desiredRevision is only used for the health check.
  - uses: argocd-update
    config:
      apps:
      - name: ${{`{{ vars.argocdApp }}`}}
        namespace: ${{`{{ vars.argocdAppNamespace }}`}}
        sources:
        - repoURL: ${{`{{ vars.gitRepo }}`}}
          {{- if $openPR }}
          desiredRevision: ${{`{{ task.outputs['wait-for-pr'].commit }}`}}
          {{- else }}
          desiredRevision: ${{`{{ task.outputs.push.commit }}`}}
          {{- end }}
{{- end }}
